name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd emotion-mlops
            git pull origin main
            docker build -t emotion-api .
            docker stop emotion-api || true
            docker rm emotion-api || true
            docker run -d -p 8000:8000 --name emotion-api emotion-api